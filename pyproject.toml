[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ullap"
version = "0.1.0"
description = "Ultra-Low-Latency Adaptive Processor (ULLAP)"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pytest>=7.0",
    "scipy>=1.10",
    "scipy-stubs"
]

[tool.pyright]
extraPaths = ["py", "scratch", "."]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["py", "scratch", "."]
testpaths = ["py"]
